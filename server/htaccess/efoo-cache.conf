# 静的ファイルのブラウザの保存期間。efoo-jp リポジトリの server/htaccess/efoo-cache.conf を
# scripts/deploy-htaccess.sh が書き込む。ここを直接編集しても、次の反映で上書きされる。
# 前段の nginx もこの max-age の間ファイルを保持するため、同じ名前のまま差し替えたファイルは
# nginx のキャッシュを消すまで古い内容が返る。写真や動画を差し替えるときはファイル名を変える。
<IfModule mod_mime.c>
  AddType font/woff2 .woff2
</IfModule>
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType image/jpeg                    "access plus 30 days"
  ExpiresByType image/png                     "access plus 30 days"
  ExpiresByType image/webp                    "access plus 30 days"
  ExpiresByType image/avif                    "access plus 30 days"
  ExpiresByType image/gif                     "access plus 30 days"
  ExpiresByType image/svg+xml                 "access plus 30 days"
  ExpiresByType video/mp4                     "access plus 30 days"
  ExpiresByType video/webm                    "access plus 30 days"
  ExpiresByType font/woff2                    "access plus 1 year"
  ExpiresByType font/woff                     "access plus 1 year"
  ExpiresByType application/font-woff         "access plus 1 year"
  ExpiresByType font/ttf                      "access plus 1 year"
  ExpiresByType application/font-sfnt         "access plus 1 year"
  ExpiresByType application/vnd.ms-fontobject "access plus 1 year"
  # CSS・JS は、内容が変わると URL の ?ver= が変わるものだけを長く保存させる。
  <If "%{QUERY_STRING} =~ /(^|&)ver=/">
    ExpiresByType text/css               "access plus 1 year"
    ExpiresByType application/javascript "access plus 1 year"
    ExpiresByType text/javascript        "access plus 1 year"
  </If>
</IfModule>
<IfModule mod_headers.c>
  <If "%{QUERY_STRING} =~ /(^|&)ver=/">
    Header append Cache-Control "immutable" "expr=%{CONTENT_TYPE} =~ m#^(text/css|application/javascript|text/javascript)#"
  </If>
</IfModule>
